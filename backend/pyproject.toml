[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lovely-chat-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi", "uvicorn[standard]", "firebase-admin"]

[tool.setuptools]
py-modules = ["main"]

[tool.fastapi]
entrypoint = "main:app"
