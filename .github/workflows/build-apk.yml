name: Build Lovely Login APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - lovely-login-screen-backup

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.lovelychat .

      - name: Set Android application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = next((p for p in [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ] if p.exists()), None)

          if app is None:
              raise SystemExit("Android app Gradle file not found")

          text = app.read_text()
          kotlin = app.suffix == ".kts"

          ns_pattern = r'(?m)^\s*namespace\s*(?:=\s*)?"[^"]+"'
          id_pattern = r'(?m)^\s*applicationId\s*(?:=\s*)?"[^"]+"'

          ns = '    namespace = "com.lovelychat.app"' if kotlin else '    namespace "com.lovelychat.app"'
          aid = '        applicationId = "com.lovelychat.app"' if kotlin else '        applicationId "com.lovelychat.app"'

          if re.search(ns_pattern, text):
              text = re.sub(ns_pattern, ns, text, count=1)
          else:
              text = text.replace("android {", "android {\n" + ns + "\n", 1)

          if re.search(id_pattern, text):
              text = re.sub(id_pattern, aid, text, count=1)
          else:
              text = text.replace("defaultConfig {", "defaultConfig {\n" + aid + "\n", 1)

          app.write_text(text)
          print("Android application ID set to com.lovelychat.app")
          PY

      - name: Add Firebase Android configuration
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Configure Firebase Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = next((p for p in [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts")
          ] if p.exists()), None)

          app = next((p for p in [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts")
          ] if p.exists()), None)

          if settings is None or app is None:
              raise SystemExit("Generated Android Gradle files not found")

          plugin = 'id("com.google.gms.google-services") version "4.4.2" apply false'
          st = settings.read_text()

          if "com.google.gms.google-services" not in st:
              if "plugins {" not in st:
                  raise SystemExit("Settings Gradle plugins block not found")
              st = st.replace("plugins {", "plugins {\n    " + plugin, 1)
              settings.write_text(st)

          at = app.read_text()
          apply_line = '    id("com.google.gms.google-services")'

          if "com.google.gms.google-services" not in at:
              if "plugins {" not in at:
                  raise SystemExit("App Gradle plugins block not found")
              at = at.replace("plugins {", "plugins {\n" + apply_line, 1)
              app.write_text(at)

          print("Firebase Gradle plugin configured")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lovely-login-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
