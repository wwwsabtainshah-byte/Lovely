name: Build Lovely Login APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - lovely-login-screen-backup

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.lovelychat .

      - name: Set Android application ID
        run: |
          python3 - <<'SCRIPT'
          from pathlib import Path
          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]
          app = next((p for p in candidates if p.exists()), None)
          if app is None:
              raise SystemExit("Android app Gradle file not found.")
          text = app.read_text()
          import re
          if re.search(r'(?m)^\s*namespace\s+', text):
              text = re.sub(r'(?m)^\s*namespace\s+["\'][^"\']+["\']', '    namespace "com.lovelychat.app"', text, count=1)
          else:
              text = text.replace("android {", 'android {\n    namespace "com.lovelychat.app"', 1)
          if re.search(r'(?m)^\s*applicationId\s+', text):
              text = re.sub(r'(?m)^\s*applicationId\s+["\'][^"\']+["\']', '        applicationId "com.lovelychat.app"', text, count=1)
          else:
              text = text.replace("defaultConfig {", 'defaultConfig {\n        applicationId "com.lovelychat.app"', 1)
          app.write_text(text)
          print("Android application ID set to com.lovelychat.app")
          SCRIPT

      - name: Add Firebase Android configuration
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Configure Firebase Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle")
          app = Path("android/app/build.gradle")

          if not settings.exists():
              settings = Path("android/settings.gradle.kts")
          if not app.exists():
              app = Path("android/app/build.gradle.kts")

          if not settings.exists() or not app.exists():
              raise SystemExit("Generated Android Gradle files were not found.")

          settings_text = settings.read_text()
          plugin = 'id("com.google.gms.google-services") version "4.4.2" apply false'
          if "com.google.gms.google-services" not in settings_text:
              marker = "plugins {"
              if marker not in settings_text:
                  raise SystemExit("Settings Gradle plugins block not found.")
              settings_text = settings_text.replace(marker, marker + "\n    " + plugin, 1)
              settings.write_text(settings_text)

          app_text = app.read_text()
          apply_line = '    id("com.google.gms.google-services")'
          if "com.google.gms.google-services" not in app_text:
              marker = "plugins {"
              if marker not in app_text:
                  raise SystemExit("App Gradle plugins block not found.")
              app_text = app_text.replace(marker, marker + "\n" + apply_line, 1)
              app.write_text(app_text)

          print("Firebase Gradle plugin configured.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lovely-login-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
